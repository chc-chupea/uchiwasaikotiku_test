<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推し活うちわメーカー</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
      padding: 10px;
    }

    #videoWrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4/3;
      margin: 0 auto;
      background: black;
      overflow: hidden;
    }

    video, img.bgImage, img.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    #designLayer {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(255,255,255,0);
      pointer-events: auto;
    }

    #designLayer span,
    #designLayer img {
      position: absolute;
      pointer-events: auto;
      cursor: move;
      user-select: none;
      transform-origin: center center;
      z-index: 5;
    }

    #previewWrapper { position: relative; display:none; }

    #previewImage {
      max-width: 90%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input, select, button {
      font-size: 1rem;
      margin: 4px;
      padding: 6px;
    }

    #finalImage {
      max-width: 90%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .form-button {
      display: inline-block;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: white;
      padding: 12px 24px;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <h1>推し活うちわメーカー</h1>

  <label>うちわテンプレート選択</label>
  <select id="templateSelector">
    <option value="fan1-lowres.png" data-highres="fan1-highres.png">無地</option>
    <option value="fan2-lowres.png" data-highres="fan2-highres.png">夏祭り①</option>
    <option value="fan3-lowres.png" data-highres="fan3-highres.png">夏祭り②</option>
  </select>

  <div id="videoWrapper">
    <video id="video" autoplay playsinline muted></video>
    <img id="bgImage" class="bgImage" style="display:none;">
    <img id="overlay" class="overlay" src="fan1-lowres.png">
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div style="margin-top:8px;">
    <button id="switchCameraBtn">📷 切替（自撮り／外向き）</button>
    <button id="captureBtn">📸 シャッター</button>
    <input type="file" id="bgFile" accept="image/*" style="display:none;">
    <button onclick="document.getElementById('bgFile').click()">📂 画像選択</button>
  </div>

  <div id="previewWrapper">
    <img id="previewImage">
    <div id="designLayer"></div>
  </div>

  <div id="editTools" style="display:none; margin-top:10px;">
    <input type="text" id="customText" placeholder="推しへのメッセージ♡">
    <input type="color" id="colorPicker" value="#ff69b4">
    <button onclick="addTextToOverlay()">テキスト追加</button>
    <button onclick="addStamp('❤️')">❤️</button>
    <button onclick="addStamp('⭐')">⭐</button>
    <button onclick="addStamp('🎶')">🎶</button>
    <button onclick="document.getElementById('stampFile').click()">📷 画像スタンプを追加</button>
    <input type="file" id="stampFile" accept="image/*" style="display:none;" multiple>
    <div><button id="finishBtn">🎨 完成！</button></div>
  </div>

  <div id="finalWrapper" style="display:none; margin-top:20px;">
    <p>📱 完成画像を長押しで保存</p>
    <img id="finalImage">
  </div>

  <script>
    const video = document.getElementById('video');
    const bgImage = document.getElementById('bgImage');
    const canvas = document.getElementById('canvas');
    const templateSelector = document.getElementById('templateSelector');
    const overlay = document.getElementById('overlay');
    const designLayer = document.getElementById('designLayer');
    let currentFacingMode = 'user';
    let currentStream = null;

    let bgPosX = 0, bgPosY = 0, bgScale = 1, bgRot = 0;
    let startDist = 0, startAngle = 0, startScale = 1, startRot = 0;
    let startX = 0, startY = 0;

    // カメラ起動
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: false
        });
        video.srcObject = currentStream;
        video.style.display = 'block';
        bgImage.style.display = 'none';
      } catch(err) { alert('カメラにアクセスできません'); }
    }
    startCamera();

    document.getElementById('switchCameraBtn').onclick = () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    };

    templateSelector.addEventListener('change', e => {
      overlay.src = e.target.value;
    });

    // 📂画像選択
    document.getElementById('bgFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        bgImage.src = reader.result;
        video.style.display = 'none';
        bgImage.style.display = 'block';
        resetBgTransform();
      };
      reader.readAsDataURL(file);
    });

    function resetBgTransform() {
      bgPosX = 0; bgPosY = 0; bgScale = 1; bgRot = 0;
      updateBgTransform();
    }

    function updateBgTransform() {
      bgImage.style.transform =
        `translate(${bgPosX}px, ${bgPosY}px) scale(${bgScale}) rotate(${bgRot}deg)`;
    }

    // 📱タッチ操作
    bgImage.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX - bgPosX;
        startY = e.touches[0].clientY - bgPosY;
      }
      if (e.touches.length === 2) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        startDist = Math.hypot(dx, dy);
        startAngle = Math.atan2(dy, dx);
        startScale = bgScale;
        startRot = bgRot;
      }
    }, {passive:false});

    bgImage.addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        bgPosX = e.touches[0].clientX - startX;
        bgPosY = e.touches[0].clientY - startY;
      }
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        bgScale = startScale * (dist / startDist);
        bgRot = startRot + (angle - startAngle) * 180 / Math.PI;
      }
      updateBgTransform();
    }, {passive:false});

    // 🖱PCマウス操作
    let dragging = false;
    bgImage.addEventListener('mousedown', e => {
      dragging = true;
      startX = e.clientX - bgPosX;
      startY = e.clientY - bgPosY;
    });
    window.addEventListener('mousemove', e => {
      if (dragging) {
        bgPosX = e.clientX - startX;
        bgPosY = e.clientY - startY;
        updateBgTransform();
      }
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('wheel', e => {
      if (e.shiftKey) { bgScale *= (e.deltaY < 0 ? 1.05 : 0.95); }
      if (e.altKey) { bgRot += (e.deltaY < 0 ? 2 : -2); }
      updateBgTransform();
    });

    // 📸 シャッター
    document.getElementById('captureBtn').addEventListener('click', () => {
      const w = 3508, h = 2480;
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0,0,w,h);
      const highres = new Image();
      highres.onload = () => {
        ctx.drawImage(highres, 0, 0, w, h);
        document.getElementById('previewImage').src = canvas.toDataURL('image/png');
        document.getElementById('previewWrapper').style.display = 'block';
        document.getElementById('editTools').style.display = 'block';
      };
      highres.src = templateSelector.selectedOptions[0].dataset.highres;
    });

    // デコレーション（簡易版）
    function addTextToOverlay() {
      const text = document.getElementById('customText').value;
      if (!text.trim()) return;
      const span = document.createElement('span');
      span.textContent = text;
      span.style.left = '50%';
      span.style.top = '50%';
      span.style.fontSize = '60px';
      span.style.fontWeight = 'bold';
      span.style.transform = 'translate(-50%, -50%)';
      designLayer.appendChild(span);
    }

    function addStamp(emoji) {
      const span = document.createElement('span');
      span.textContent = emoji;
      span.style.left = '50%';
      span.style.top = '50%';
      span.style.fontSize = '80px';
      span.style.transform = 'translate(-50%, -50%)';
      designLayer.appendChild(span);
    }

    document.getElementById('stampFile').addEventListener('change', e => {
      [...e.target.files].forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.style.left = '50%';
        img.style.top = '50%';
        img.style.maxWidth = '30%';
        img.style.transform = 'translate(-50%, -50%)';
        designLayer.appendChild(img);
      });
    });

    // 🎨 完成ボタン → 合成
    document.getElementById('finishBtn').addEventListener('click', () => {
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 3508;
      finalCanvas.height = 2480;
      const ctx = finalCanvas.getContext('2d');

      ctx.clearRect(0,0,finalCanvas.width,finalCanvas.height);

      // 背景画像を描画（transform適用）
      if (bgImage.style.display !== 'none' && bgImage.src) {
        const img = bgImage;
        const centerX = finalCanvas.width/2;
        const centerY = finalCanvas.height/2;
        ctx.save();
        ctx.translate(centerX + bgPosX*4, centerY + bgPosY*4); // 4倍: スマホ→A4スケール
        ctx.rotate(bgRot * Math.PI/180);
        ctx.scale(bgScale, bgScale);
        ctx.drawImage(img, -centerX, -centerY, finalCanvas.width, finalCanvas.height);
        ctx.restore();
      }

      // うちわテンプレ
      const highres = new Image();
      highres.onload = () => {
        ctx.drawImage(highres, 0, 0, finalCanvas.width, finalCanvas.height);

        // デコレーション
        const items = Array.from(designLayer.children);
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const previewRect = document.getElementById('previewWrapper').getBoundingClientRect();
          const scaleX = finalCanvas.width / previewRect.width;
          const scaleY = finalCanvas.height / previewRect.height;
          const x = (rect.left - previewRect.left + rect.width/2) * scaleX;
          const y = (rect.top - previewRect.top + rect.height/2) * scaleY;
          ctx.save();
          ctx.translate(x, y);
          if (item.tagName === 'SPAN') {
            ctx.font = `bold ${parseFloat(window.getComputedStyle(item).fontSize)*scaleX}px sans-serif`;
            ctx.fillStyle = "#ff69b4";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(item.textContent, 0, 0);
          } else if (item.tagName === 'IMG') {
            ctx.drawImage(item, -item.width/2 * scaleX, -item.height/2 * scaleY,
                          item.width * scaleX, item.height * scaleY);
          }
          ctx.restore();
        });

        document.getElementById('finalImage').src = finalCanvas.toDataURL('image/png');
        document.getElementById('finalWrapper').style.display = 'block';
      };
      highres.src = templateSelector.selectedOptions[0].dataset.highres;
    });
  </script>
</body>
</html>
