<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myうちわ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
      padding: 10px;
    }
    #videoWrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background-color: black;
      overflow: hidden;
    }
    video, img.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      touch-action: none;
    }
    video {
      transform-origin: center center;
    }
    canvas { display: none; }
    #captureBtn, #switchCameraBtn {
      margin-top: 15px;
      background: none;
      border: none;
      cursor: pointer;
    }
    #captureBtn img {
      width: 60px;
      height: auto;
    }
    #switchCameraBtn {
      font-size: 16px;
      padding: 8px 16px;
      background-color: #eee;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .form-button {
      display: inline-block;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: white;
      padding: 12px 24px;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    .form-button:hover {
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    }
    #zoomValue { font-weight: bold; }
    #pinchZoomNotice { font-size: 14px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="langButtons">
    <button onclick="setLanguage('ja')">日本語</button>
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('zh')">中文</button>
    <button onclick="setLanguage('ko')">한국어</button>
    <button onclick="setLanguage('vi')">Tiếng Việt</button>
  </div>

  <h1 id="title"
    data-ja="作っちゃおう！Myうちわ"
    data-en="Let's Make Our Own Fan!"
    data-zh="一起来制作我们的团扇！"
    data-ko="우리만의 부채를 만들어보자!"
    data-vi="Hãy cùng làm quạt giấy của riêng mình!">
    作っちゃおう！Myうちわ
  </h1>

  <label id="templateLabel"
    data-ja="うちわのデザインを選んでね👉"
    data-en="Choose a fan design👉"
    data-zh="请选择一个团扇设计👉"
    data-ko="부채 디자인을 선택하세요👉"
    data-vi="Chọn thiết kế quạt:">
    うちわのデザインを選んでね👉
  </label>
  <select id="templateSelector">
    <option value="fan1-lowres.png" data-highres="fan1-highres.png">無地</option>
    <option value="fan2-lowres.png" data-highres="fan2-highres.png">夏祭り①</option>
    <option value="fan3-lowres.png" data-highres="fan3-highres.png">夏祭り②</option>
  </select>

  <div id="videoWrapper">
    <video id="video" autoplay playsinline muted></video>
    <img id="overlay" class="overlay" src="fan1-lowres.png" alt="テンプレ画像">
    <canvas id="canvas"></canvas>
  </div>

  <div id="pinchZoomNotice">
    画面を <strong>2本の指</strong> でズーム（ピンチイン・ピンチアウト）できます
  </div>

  <div style="margin-top: 10px;">
    <label for="zoomSlider">🔍 ズーム：</label>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1" style="width: 80%;">
    <span id="zoomValue">1.00x</span>
  </div>

  <button id="captureBtn"><img src="shutterbotann.png" alt="撮影"></button>
  <button id="switchCameraBtn">📷 切替（自撮り／外向き）</button>

  <div id="previewWrapper" style="display:none;">
    <img id="previewImage" style="max-width:90%; margin-top:20px; border:1px solid #ccc; border-radius:10px;">
  </div>

  <p id="notice" style="display: none;"></p>

  <div id="formButtonWrapper" style="margin-top: 12px;">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdAf9ZuaIIWqMmxMPZzhmMs6zFWV_OyyI5OEUvqdCnIpnS-Xg/viewform?usp=dialog"
    target="_blank" class="form-button">📝 注文フォームへ進む</a>
  </div>

  <audio id="shutterSound" src="camera-shutter.mp3" preload="auto"></audio>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('canvas');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValue = document.getElementById('zoomValue');
    const shutterSound = document.getElementById('shutterSound');
    const notice = document.getElementById('notice');
    const previewImage = document.getElementById('previewImage');
    const previewWrapper = document.getElementById('previewWrapper');
    const templateSelector = document.getElementById('templateSelector');

    let currentStream = null;
    let currentScale = 1;
    let initialDistance = null;
    let currentFacing = 'user';

    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: currentFacing } },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
      } catch {
        const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        currentStream = fallback;
        video.srcObject = fallback;
      }
    }

    document.getElementById('switchCameraBtn').addEventListener('click', () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      startCamera();
    });

    templateSelector.addEventListener('change', e => {
      const lowres = e.target.value;
      overlay.src = lowres + '?t=' + Date.now();
    });

    zoomSlider.addEventListener('input', () => {
      const scale = parseFloat(zoomSlider.value);
      video.style.transform = `scale(${scale})`;
      zoomValue.textContent = `${scale.toFixed(2)}x`;
      currentScale = scale;
    });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    video.addEventListener('touchstart', e => {
      if (e.touches.length === 2) initialDistance = getDistance(e.touches);
    });

    video.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && initialDistance) {
        e.preventDefault();
        const newDist = getDistance(e.touches);
        const delta = newDist / initialDistance;
        const newScale = Math.min(3, Math.max(1, currentScale * delta));
        video.style.transform = `scale(${newScale})`;
        zoomSlider.value = newScale;
        zoomValue.textContent = `${newScale.toFixed(2)}x`;
      }
    }, { passive: false });

    video.addEventListener('touchend', () => {
      currentScale = parseFloat(zoomSlider.value);
      initialDistance = null;
    });

    document.getElementById('captureBtn').addEventListener('click', () => {
      shutterSound.play();
      const w = 3508, h = 2480;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const aspectV = vw / vh, aspectC = w / h;
      let sx = 0, sy = 0, sw = vw, sh = vh;

      if (aspectV > aspectC) {
        sw = vh * aspectC;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / aspectC;
        sy = (vh - sh) / 2;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);

      const highres = new Image();
      highres.crossOrigin = "anonymous";
      highres.onload = () => {
        ctx.drawImage(highres, 0, 0, w, h);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          previewImage.src = url;
          previewWrapper.style.display = 'block';
          notice.style.display = 'block';
          notice.innerHTML = `iPhone：画像を👆長押しして保存<br>Android：画像を👆長押しして保存`;
        }, 'image/png');
      };
      const selected = templateSelector.selectedOptions[0];
      highres.src = selected.dataset.highres;
    });

    function setLanguage(lang) {
      document.querySelectorAll('[data-ja]').forEach(el => {
        if (el.dataset[lang]) el.innerHTML = el.dataset[lang];
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
      const userLang = navigator.language.slice(0,2);
      if (['ja','en','zh','ko','vi'].includes(userLang)) {
        setLanguage(userLang);
      }
    });
  </script>

  <footer style="font-size: 10px; color: #888;">
    © 2025 Chugoku Shimbun Hanbai Center. Web app developed by Hitomi Sasaki.
  </footer>
</body>
</html>
