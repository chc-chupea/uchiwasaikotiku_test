<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myうちわ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
      padding: 10px;
    }
    #videoWrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background-color: black;
      overflow: hidden;
    }
    video, img.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video {
      transform-origin: center center;
      touch-action: none;
      /* prevent browser pinch-zoom */
    }
    canvas {
      display: none;
    }
    #captureBtn, #switchCameraBtn {
      margin-top: 15px;
      background: none;
      border: none;
      cursor: pointer;
    }
    #captureBtn img {
      width: 60px;
      height: auto;
    }
    #switchCameraBtn {
      font-size: 16px;
      padding: 8px 16px;
      background-color: #eee;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #notice {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
    #notice a:not(.form-button) {
      color: #0077cc;
      text-decoration: underline;
    }
    .form-button {
      display: inline-block;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: white;
      padding: 12px 24px;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    .form-button:hover {
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    }
    #langButtons {
      margin-top: 10px;
    }
    #langButtons button {
      margin: 0 5px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    #overlay {
      position: absolute;
      cursor: grab;
    }
    .fan-container {
      display: none;
    }
    .fan-print {
      display: none;
    }
    @media print {
      .fan-screen {
        display: none !important;
      }
      .fan-print {
        display: block !important;
      }
    }
    #downloadNotice {
      font-size: 0.7em;
    }
    /* ズームスライダーのスタイル調整 */
    #zoomSlider {
      width: 80%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="langButtons">
    <button onclick="setLanguage('ja')">日本語</button>
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('zh')">中文</button>
    <button onclick="setLanguage('ko')">한국어</button>
    <button onclick="setLanguage('vi')">Tiếng Việt</button>
  </div>

  <h1 id="title" style="font-size: 14px;"
      data-ja="作っちゃおう！Myうちわ"
      data-en="Let's Make Our Own Fan!"
      data-zh="一起来制作我们的团扇！"
      data-ko="우리만의 부채를 만들어보자!"
      data-vi="Hãy cùng làm quạt giấy của riêng mình!">
    作っちゃおう！Myうちわ
  </h1>

  <label id="templateLabel" style="font-size: 14px;"
         data-ja="うちわのデザインを選んでね👉"
         data-en="Choose a fan design👉"
         data-zh="请选择一个团扇设计👉"
         data-ko="부채 디자인을 선택하세요👉"
         data-vi="Chọn thiết kế quạt:">
    うちわのデザインを選んでね👉
  </label>
  <select id="templateSelector">
    <option value="fan1-lowres.png" data-highres="fan1-highres.png">無地</option>
    <option value="fan2-lowres.png" data-highres="fan2-highres.png">夏祭り①</option>
    <option value="fan3-lowres.png" data-highres="fan3-highres.png">夏祭り②</option>
  </select>

  <div id="videoWrapper">
    <video id="video" autoplay playsinline muted></video>
    <img id="overlay" class="overlay" src="fan1-lowres.png" alt="うちわテンプレ画像">
    <canvas id="canvas"></canvas>
  </div>

  <div>
    <label for="zoomSlider">🔍 ズーム：</label>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    <span id="zoomValue">1.0x</span>
  </div>

  <button id="captureBtn">
    <img src="shutterbotann.png" alt="シャッターボタン">
  </button>

  <button id="switchCameraBtn">📷 切替（自撮り／外向き）</button>

  <p id="downloadNotice" class="text-center text-sm mt-2 text-gray-600"></p>

  <div id="previewWrapper" style="display:none;">
    <img id="previewImage" style="max-width: 90%; margin-top: 20px; border: 1px solid #ccc; border-radius: 10px;">
  </div>

  <p id="notice" style="display: none;"></p>

  <div id="formButtonWrapper" style="display: block; margin-top: 12px;">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdAf9ZuaIIWqMmxMPZzhmMs6zFWV_OyyI5OEUvqdCnIpnS-Xg/viewform?usp=dialog"
     target="_blank"
     class="form-button">📝 注文フォームへ進む</a>
  </div>

  <audio id="shutterSound" src="camera-shutter.mp3" preload="auto"></audio>
  <div class="fan-container"></div>

  <script>
    async function getCameraStream(facingMode) {
      try {
        const constraints = {
          video: {
            facingMode: { exact: facingMode }
          },
          audio: false
        };
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (e) {
        console.warn('Fallback to default camera:', e);
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
    }

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('canvas');
    const shutterSound = document.getElementById('shutterSound');
    const captureBtn = document.getElementById('captureBtn');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const notice = document.getElementById('notice');
    const templateSelector = document.getElementById('templateSelector');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValue = document.getElementById('zoomValue');

    let currentLowRes = templateSelector.value;
    let currentHighRes = templateSelector.selectedOptions[0].dataset.highres;
    let currentFacingMode = 'user';
    let currentStream = null;

    // 現在のズーム倍率（初期1）
    let currentZoom = 1;

    // スライダー操作でズーム変更
    zoomSlider.addEventListener('input', () => {
      currentZoom = parseFloat(zoomSlider.value);
      video.style.transform = `scale(${currentZoom})`;
      zoomValue.textContent = `${currentZoom.toFixed(1)}x`;
    });

    // 多言語切替
    function setLanguage(lang) {
      document.querySelectorAll('[data-ja]').forEach(el => {
        if (el.dataset[lang]) {
          el.innerHTML = el.dataset[lang];
        }
      });
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await getCameraStream(currentFacingMode);
        currentStream = stream;
        video.srcObject = stream;
      } catch (err) {
        alert('カメラにアクセスできませんでした。許可を確認してください。');
        console.error(err);
      }
    }

    switchCameraBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    templateSelector.addEventListener('change', e => {
      const selectedOption = e.target.selectedOptions[0];
      currentLowRes = selectedOption.value;
      currentHighRes = selectedOption.dataset.highres;
      overlay.src = currentLowRes + '?t=' + Date.now();
    });

    // ピンチ操作のズーム対応
    let lastDistance = null;
    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    video.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        lastDistance = getDistance(e.touches);
      }
    });

    video.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && lastDistance !== null) {
        const newDistance = getDistance(e.touches);
        let scale = currentZoom;
        const scaleChange = newDistance / lastDistance;
        scale *= scaleChange;
        // ズーム範囲を制限
        scale = Math.min(Math.max(scale, parseFloat(zoomSlider.min)), parseFloat(zoomSlider.max));
        currentZoom = scale;
        zoomSlider.value = currentZoom.toFixed(2);
        zoomValue.textContent = `${currentZoom.toFixed(2)}x`;
        video.style.transform = `scale(${currentZoom})`;
        lastDistance = newDistance;
        e.preventDefault();
      }
    });

    video.addEventListener('touchend', e => {
      if (e.touches.length < 2) {
        lastDistance = null;
      }
    });

    // 撮影時にズーム倍率を考慮して切り取り範囲を計算し描画
    captureBtn.addEventListener('click', () => {
      if (video.readyState < 2) {
        alert('カメラがまだ準備中です。数秒待ってから、もう一度シャッターを押してください。');
        return;
      }
      shutterSound.currentTime = 0;
      shutterSound.play().catch(() => {});

      const w = 3508, h = 2480;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      const vw = video.videoWidth || video.offsetWidth;
      const vh = video.videoHeight || video.offsetHeight;

      const zoom = currentZoom || 1;

      // ズーム倍率を考慮し、中心を基準に動画の切り抜き範囲を計算
      const sw = vw / zoom;
      const sh = vh / zoom;
      const sx = (vw - sw) / 2;
      const sy = (vh - sh) / 2;

      const aspectCanvas = w / h;
      const aspectVideo = vw / vh;

      let drawSx = sx, drawSy = sy, drawSw = sw, drawSh = sh;

      // アスペクト比に合わせてトリミング調整
      if (aspectVideo > aspectCanvas) {
        drawSw = sh * aspectCanvas;
        drawSx = sx + (sw - drawSw) / 2;
        drawSh = sh;
        drawSy = sy;
      } else {
        drawSh = sw / aspectCanvas;
        drawSy = sy + (sh - drawSh) / 2;
        drawSw = sw;
        drawSx = sx;
      }

      ctx.drawImage(video, drawSx, drawSy, drawSw, drawSh, 0, 0, w, h);

      // テンプレートの高解像度画像を合成
      const highresImg = new Image();
      highresImg.crossOrigin = "anonymous";
      highresImg.onload = () => {
        ctx.drawImage(highresImg, 0, 0, w, h);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const previewWrapper = document.getElementById('previewWrapper');
          const previewImg = document.getElementById('previewImage');
          previewImg.onload = () => {
            notice.scrollIntoView({ behavior: 'smooth' });
          };
          previewImg.src = '';
          previewImg.src = url;
          previewWrapper.style.display = 'block';
          notice.style.display = 'block';
          notice.innerHTML = `
            iPhone：画像を👆長押しして「“写真”に保存」を選ぶ<br><br>
            Android：画像を👆長押しして「画像を保存」で"ギャラリー"に保存します<br><br>
            保存が終わったら、以下のボタンから申込フォームへお進みください。<br>
          `;
        }, 'image/png');
      };
      highresImg.src = currentHighRes;
    });

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
      const userLang = navigator.language.slice(0, 2);
      const supportedLangs = ['ja', 'en', 'zh', 'ko', 'vi'];
      if (supportedLangs.includes(userLang)) {
        setLanguage(userLang);
      }
    });
  </script>

</body>
</html>
